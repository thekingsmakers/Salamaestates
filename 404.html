<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salama Estates | Public Information Portal</title>
  <script>
    // GitHub Pages Single Page Application Router Fallback
    (function() {
      try {
        var rawPath = window.location.pathname.replace(/^\/+/, '');
        if (rawPath.toLowerCase().includes('admin')) {
          sessionStorage.removeItem('salama_active_url');
          window.location.replace('/admin.html');
          return;
        }
        if (rawPath && rawPath !== '404.html') {
          sessionStorage.setItem('salama_active_url', rawPath);
        }
      } catch (e) {}
      // Seamlessly redirect to the clean root domain
      window.location.replace('/');
    })();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #F7F9FA;
      color: #161F22;
      text-align: center;
    }
    .redirect-card {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      max-width: 400px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #E0F3F5;
      border-top-color: #0E7D8B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner"></div>
    <h2 style="font-size: 1.15rem; margin: 0 0 8px;">Loading Salama Estates...</h2>
    <p style="font-size: 0.88rem; color: #5C6F75; margin: 0;">Directing you to <a href="/" style="color: #0E7D8B; text-decoration: none; font-weight: 600;">info.salamaestates.com</a></p>
  </div>
</body>
</html>
